<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>Network Topology — Fullscreen</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="/static/css/responsive.css">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-elk@2.1.0/dist/cytoscape-elk.umd.js"></script>
<script src="https://unpkg.com/cytoscape-navigator/cytoscape-navigator.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#f8fafc;font-family:'Inter',system-ui,sans-serif;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#334155;border-radius:6px;}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes popIn{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes glowBadge{0%,100%{box-shadow:0 0 4px rgba(239,68,68,.3)}50%{box-shadow:0 0 16px rgba(239,68,68,.7)}}

.fs-toolbar{position:fixed;top:12px;right:12px;z-index:999;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.fs-btn{background:rgba(15,23,42,.85);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);border-radius:30px;color:#e2e8f0;font-size:12px;font-weight:600;padding:6px 14px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s;}
.fs-btn:hover{background:rgba(30,41,59,.95);border-color:rgba(255,255,255,.3);color:#fff;}
.fs-btn.exit{border-color:rgba(239,68,68,.4);color:#fca5a5;}
.fs-btn.exit:hover{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.6);color:#fff;}
.fs-btn-group{background:rgba(15,23,42,.85);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);border-radius:30px;color:#e2e8f0;font-size:12px;font-weight:600;padding:5px 10px;display:flex;align-items:center;gap:5px;}
.fs-btn.active-problems{background:rgba(59,130,246,.2);border-color:rgba(59,130,246,.5);color:#60a5fa;}
.fs-btn.active-lock{border-color:rgba(239,68,68,.5);color:#fca5a5;background:rgba(239,68,68,.1);}

.fs-search{position:fixed;top:12px;left:12px;z-index:999;display:flex;gap:6px;align-items:center;}
.fs-search input{background:rgba(15,23,42,.85);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);border-radius:30px;color:#e2e8f0;font-size:12px;font-weight:500;padding:6px 14px 6px 32px;width:220px;outline:none;transition:all .15s;}
.fs-search input:focus{border-color:rgba(59,130,246,.6);width:280px;}
.fs-search input::placeholder{color:#64748b;}
.fs-search i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#64748b;font-size:12px;pointer-events:none;}

.fs-info{position:fixed;bottom:12px;left:12px;z-index:999;background:rgba(15,23,42,.85);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px 14px;color:#94a3b8;font-size:11px;display:flex;align-items:center;gap:12px;}
.fs-info .dot{width:6px;height:6px;border-radius:50%;}
.fs-info .dot.up{background:#22c55e;}
.fs-info .dot.down{background:#ef4444;}

#cy{
    width:100%;
    height:100%;
    background-color:#ffffff;
    background-image:
        linear-gradient(rgba(148,163,184,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148,163,184,.08) 1px, transparent 1px);
    background-size:40px 40px;
    display:none;
}
#loading{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:14px;gap:12px;flex-direction:column;}
.spinner{width:26px;height:26px;border:3px solid #1e293b;border-top-color:#3b82f6;border-radius:50%;animation:spin .7s linear infinite;}

.node-tooltip{position:fixed;display:none;z-index:99990;background:rgba(10,18,28,.97);color:#fff;border-radius:16px;padding:14px 18px;font-size:13px;line-height:1.6;min-width:240px;max-width:290px;box-shadow:0 20px 40px -10px rgba(0,0,0,.5);pointer-events:none;border:1px solid rgba(255,255,255,.1);animation:popIn .12s ease;}
.tt-title{font-weight:700;font-size:14px;margin-bottom:8px;color:#ffd966;display:flex;align-items:center;gap:7px;}
.tt-divider{height:1px;background:rgba(255,255,255,.1);margin:6px 0;}
.tt-row{display:flex;justify-content:space-between;gap:14px;margin-top:3px;}
.tt-label{color:#7fa3c4;font-size:11px;white-space:nowrap;}
.tt-value{color:#e2ecf7;font-weight:500;font-size:11px;text-align:right;word-break:break-all;}
.tt-status{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12px;}
.tt-children{margin-top:8px;padding:6px 9px;background:rgba(59,130,246,.18);border-radius:8px;font-size:11px;color:#93c5fd;display:flex;align-items:center;gap:6px;}
.tt-hint{margin-top:6px;padding:5px 8px;background:rgba(255,255,255,.06);border-radius:7px;font-size:10px;color:#94a3b8;}

.ctx-menu{position:fixed;background:rgba(15,23,42,.97);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:5px 3px;font-size:13px;z-index:99999;min-width:200px;box-shadow:0 12px 30px rgba(0,0,0,.4);display:none;animation:popIn .12s ease;}
.ctx-ip-header{padding:8px 14px 5px;font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ctx-menu-sep{height:1px;background:rgba(255,255,255,.08);margin:4px 8px;}
.ctx-menu-item{padding:8px 14px;cursor:pointer;border-radius:8px;display:flex;align-items:center;gap:9px;color:#e2e8f0;transition:background .13s;user-select:none;}
.ctx-menu-item:hover{background:rgba(255,255,255,.08);}
.ctx-menu-item i{width:16px;text-align:center;font-size:13px;}
.ctx-menu-item.ctx-expand i{color:#22c55e;}
.ctx-menu-item.ctx-collapse i{color:#f59e0b;}
.ctx-menu-item.ctx-hide i{color:#ef4444;}
.ctx-menu-item.ctx-focus i{color:#3b82f6;}
.ctx-menu-item.ctx-detail i{color:#8b5cf6;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;display:none;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-box{background:rgba(15,23,42,.97);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:22px 26px;max-width:530px;width:93%;max-height:82vh;overflow-y:auto;position:relative;box-shadow:0 28px 55px rgba(0,0,0,.4);animation:popIn .15s ease;color:#e2e8f0;}
.modal-close{position:absolute;top:14px;right:18px;background:none;border:none;font-size:22px;cursor:pointer;color:#64748b;line-height:1;}
.modal-close:hover{color:#fff;}

.legend-box{position:absolute;bottom:14px;left:14px;background:rgba(15,23,42,.9);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:11px 15px;font-size:12px;z-index:500;box-shadow:0 4px 18px rgba(0,0,0,.3);display:block;min-width:172px;color:#e2e8f0;}
.leg-title{font-weight:700;margin-bottom:8px;font-size:12px;color:#e2e8f0;display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;}
.legend-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;color:#cbd5e1;font-size:12px;line-height:1.4;}
.leg-dot{display:inline-block;width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.leg-line{display:inline-block;width:24px;height:4px;flex-shrink:0;border-radius:2px;}
.leg-sep{height:1px;background:rgba(255,255,255,.1);margin:6px 0;}
.legend-box.collapsed #legendContent{display:none;}
.legend-box.collapsed .leg-title{margin-bottom:0;}


.sync-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.25);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:600;opacity:0;transition:opacity .4s;}
.sync-badge.show{opacity:1;}

.fs-btn.admin-only{display:none;}
body.is-admin .fs-btn.admin-only{display:flex;}

.role-badge{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:999;background:rgba(15,23,42,.85);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:4px 14px;font-size:11px;font-weight:600;color:#94a3b8;display:flex;align-items:center;gap:6px;}
.role-badge i{font-size:10px;}
.role-badge.viewer{color:#94a3b8;}
.role-badge.admin{color:#3b82f6;}

#pingFlash{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:99999;display:none;background:#16a34a;color:white;padding:14px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);font-weight:600;}

.kpi-row{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:999;display:flex;gap:10px;}
.kpi-card{background:rgba(15,23,42,.85);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:8px 18px;text-align:center;min-width:90px;}
.kpi-card .number{font-size:22px;font-weight:800;color:#e2e8f0;line-height:1.2;}
.kpi-card .label{color:#94a3b8;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.kpi-card.up .number{color:#22c55e;}
.kpi-card.down .number{color:#ef4444;}

.alert-panel{position:fixed;top:56px;left:12px;z-index:999;background:rgba(15,23,42,.9);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 14px;max-width:280px;max-height:200px;overflow-y:auto;display:none;color:#e2e8f0;font-size:12px;}
.alert-panel.show{display:block;}
.alert-item{padding:6px 10px;border-radius:8px;margin-bottom:4px;background:rgba(249,115,22,.1);border-left:3px solid #f97316;font-size:12px;color:#fcd34d;}
.alert-panel .alert-head{font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
</style>
</head>
<body>
<script>
    window.USER_ROLE = "{{ user_role }}";
    window.IS_ADMIN = {{ 'true' if is_admin else 'false' }};
</script>

<div class="fs-search">
    <i class="fas fa-search"></i>
    <input type="text" id="searchInput" placeholder="Search IP or name…" />
</div>

<div class="fs-toolbar">
    <span class="sync-badge" id="syncBadge"><i class="fas fa-check-circle"></i> Saved</span>
    <button class="fs-btn" id="fitBtn"><i class="fas fa-expand-alt"></i> Fit</button>
    <button class="fs-btn" id="expandAllBtn"><i class="fas fa-plus-square"></i> Expand All</button>
    <button class="fs-btn" id="collapseAllBtn"><i class="fas fa-minus-square"></i> Collapse All</button>
    <button class="fs-btn admin-only" id="resetLayoutBtn"><i class="fas fa-redo"></i> Auto Adjust</button>
    <button class="fs-btn admin-only" id="lockLayoutBtn"><i class="fas fa-lock"></i> Lock Layout</button>
    <button class="fs-btn" id="pingBtn"><i class="fas fa-network-wired"></i> Ping All</button>
    <button class="fs-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
    <button class="fs-btn exit" id="exitBtn"><i class="fas fa-times"></i> Exit</button>
</div>

<div class="kpi-row" id="kpiRow">
    <div class="kpi-card"><div class="number" id="kpiTotal">—</div><div class="label"><i class="fas fa-network-wired"></i> Devices</div></div>
    <div class="kpi-card up"><div class="number" id="kpiUp">—</div><div class="label"><i class="fas fa-check-circle"></i> Up</div></div>
    <div class="kpi-card down"><div class="number" id="kpiDown">—</div><div class="label"><i class="fas fa-exclamation-triangle"></i> Down</div></div>
</div>

<div class="alert-panel" id="alertPanel">
    <div class="alert-head"><span><i class="fas fa-bell me-1 text-danger"></i>Alerts</span><span id="alertCount">0</span></div>
    <div id="alertList"></div>
</div>

<div id="loading"><div class="spinner"></div><span>Loading topology…</span></div>
<div id="cy"></div>

<div id="cy-wrap" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;">
    <div class="legend-box collapsed" id="legendBox" style="pointer-events:auto;">
        <div class="leg-title" id="legendToggle"><i class="fas fa-layer-group"></i>Legend<i class="fas fa-chevron-right ms-auto" id="legendIcon"></i></div>
        <div id="legendContent">
            <div class="legend-row"><span class="leg-dot" style="background:#22c55e;"></span>Device Up</div>
            <div class="legend-row"><span class="leg-dot" style="background:#f59e0b;"></span>Warning</div>
            <div class="legend-row"><span class="leg-dot" style="background:#ef4444;"></span>Device Down</div>
            <div class="leg-sep"></div>
            <div class="legend-row"><span class="leg-line" style="background:#22c55e;"></span>Link Up</div>
            <div class="legend-row"><span class="leg-line" style="background:repeating-linear-gradient(to right,#ef4444 0,#ef4444 5px,transparent 5px,transparent 9px);height:2.5px;"></span>Link Down</div>
            <div class="leg-sep"></div>
            <div class="legend-row" style="color:#94a3b8;font-size:11px;"><span style="display:inline-block;width:13px;height:13px;border-radius:50%;border:2px dashed #f59e0b;flex-shrink:0;"></span>Collapsed Branch</div>
            <div class="legend-row" style="color:#94a3b8;font-size:11px;"><i class="fas fa-link fa-fw" style="color:#8b5cf6;"></i>Shared Node</div>
        </div>
    </div>
    <div id="cy-minimap" style="pointer-events:auto;"></div>
</div>

<div class="node-tooltip" id="nodeTooltip"></div>

<div class="ctx-menu" id="ctxMenu">
    <div class="ctx-ip-header" id="ctxIpHeader">—</div>
    <div class="ctx-menu-sep"></div>
    <div class="ctx-menu-item ctx-expand"   id="ctxExpand">       <i class="fas fa-plus-circle"></i>  Expand</div>
    <div class="ctx-menu-item ctx-collapse" id="ctxCollapseNode"> <i class="fas fa-minus-circle"></i> Collapse</div>
    <div class="ctx-menu-sep"></div>
    <div class="ctx-menu-item" id="ctxOpenHTTP"> <i class="fas fa-globe"></i>  Open HTTP (80)</div>
    <div class="ctx-menu-item" id="ctxOpenHTTPS"><i class="fas fa-lock"></i>   Open HTTPS (443)</div>
    <div class="ctx-menu-sep"></div>
    <div class="ctx-menu-item" id="ctxPing"><i class="fas fa-satellite-dish"></i> Ping Device</div>
    <div class="ctx-menu-sep"></div>
    <div class="ctx-menu-item ctx-detail" id="ctxDetails"><i class="fas fa-info-circle"></i> View Details</div>
</div>

<div class="modal-overlay" id="linkModalOverlay">
    <div class="modal-box">
        <button class="modal-close" id="modalCloseBtn">&times;</button>
        <h5 id="linkModalTitle" style="font-size:17px;font-weight:700;margin-bottom:14px;padding-right:30px;color:#e2e8f0;"></h5>
        <div id="linkModalBody"></div>
    </div>
</div>

<div id="pingFlash"></div>

<script>
    if (window.IS_ADMIN) {
        document.body.classList.add('is-admin');
    }
</script>
<script src="{{ url_for('static', filename='js/topology.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    window.initTopology({
        mode: 'fullscreen',

        cyContainer: '#cy',
        loadingEl: '#loading',

        pingFlashEl: '#pingFlash',
        syncBadgeEl: '#syncBadge',

        fitBtn: '#fitBtn',
        expandAllBtn: '#expandAllBtn',
        collapseAllBtn: '#collapseAllBtn',

        resetLayoutBtn: '#resetLayoutBtn',
        lockLayoutBtn: '#lockLayoutBtn',

        pingBtn: '#pingBtn',
        refreshBtn: '#refreshBtn',

        searchInput: '#searchInput',

        legendBox: '#legendBox',
        legendToggle: '#legendToggle',
        legendIcon: '#legendIcon',

        nodeTooltip: '#nodeTooltip',

        ctxMenu: '#ctxMenu',

        modalOverlay: '#linkModalOverlay',
        modalTitle: '#linkModalTitle',
        modalBody: '#linkModalBody',
        modalClose: '#modalCloseBtn',

        minimapEl: '#cy-minimap',

        kpiTotal: '#kpiTotal',
        kpiUp: '#kpiUp',
        kpiDown: '#kpiDown',

        alertPanel: '#alertPanel',
        alertList: '#alertList',
        alertCount: '#alertCount',

        exitBtn: '#exitBtn',

        categoryMenu: '#categoryMenu',

        sharedLegend: '#sharedLegend'
    });
});
</script>
</body>
</html>

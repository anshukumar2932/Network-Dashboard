<button class="sidebar-toggle-mobile" id="sidebarToggleMobile" onclick="openMobileSidebar()" aria-label="Open navigation menu" title="Open navigation">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
</button>

<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-brand">
            <svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="#3b82f6" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
                <path d="M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/>
            </svg>
            <span class="brand-text">NetDash</span>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" aria-label="Toggle sidebar" title="Collapse sidebar">&#171;</button>
    </div>

    <nav class="sidebar-nav">
        <div class="nav-section-label">Monitor</div>
        <a href="/dashboard"{% if active_page == 'dashboard' %} class="active"{% endif %}>
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7" rx="1"/>
                <rect x="14" y="3" width="7" height="7" rx="1"/>
                <rect x="3" y="14" width="7" height="7" rx="1"/>
                <rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
            <span class="nav-text">Dashboard</span>
        </a>
        <a href="/links"{% if active_page == 'links' %} class="active"{% endif %}>
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
            <span class="nav-text">Links</span>
        </a>

        <div class="nav-section-label">Inventory</div>
        <a href="/devices" class="nav-link" aria-label="Devices List">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <!-- Device / Monitor Icon -->
                <rect x="3" y="4" width="18" height="12" rx="2"></rect>
                <line x1="8" y1="20" x2="16" y2="20"></line>
                <line x1="12" y1="16" x2="12" y2="20"></line>
            </svg>

            <span class="nav-text">Devices</span>
        </a>
        {% if is_admin %}
        <a href="/devices/upload"{% if active_page == 'upload' %} class="active"{% endif %}>
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span class="nav-text">Upload Devices</span>
        </a>
        {% endif %}

        {% if is_admin %}
        <div class="nav-section-label">Admin</div>
        <a href="/admin/users"{% if active_page == 'admin_users' %} class="active"{% endif %}>
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span class="nav-text">Users</span>
        </a>
        {% endif %}

    </nav>

    

    <div class="sidebar-footer">
        <a href="/logout" class="logout-link">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span class="nav-text">Logout</span>
        </a>
    </div>
</div>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeMobileSidebar()"></div>

<style>
/* ── Sidebar shell ── */
.sidebar {
    width: 240px;
    min-height: 100vh;
    background: #0f172a;
    color: #fff;
    position: fixed;
    left: 0; top: 0;
    z-index: 1050;
    box-shadow: 2px 0 12px rgba(0,0,0,0.15);
    transition: width 0.25s ease;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ── Header ── */
.sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 14px;
    border-bottom: 1px solid #1e293b;
    flex-shrink: 0;
    min-height: 62px;
}
.sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
    white-space: nowrap;
    text-decoration: none;
}
.brand-icon {
    flex-shrink: 0;
    display: block;
}
.brand-text {
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.5px;
    color: #f1f5f9;
    transition: opacity 0.2s, width 0.2s;
}
.sidebar-toggle {
    background: none;
    border: none;
    color: #475569;
    font-size: 16px;
    cursor: pointer;
    padding: 5px 7px;
    border-radius: 6px;
    transition: color 0.2s, background 0.2s;
    flex-shrink: 0;
    line-height: 1;
}
.sidebar-toggle:hover { color: #f1f5f9; background: #1e293b; }

/* ── Nav ── */
.sidebar-nav {
    padding: 10px 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    overflow-x: hidden;
}
.nav-section-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #334155;
    padding: 12px 16px 4px;
    white-space: nowrap;
    overflow: hidden;
    transition: opacity 0.2s;
}
.sidebar-nav a {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    gap: 12px;
    color: #94a3b8;
    text-decoration: none;
    transition: color 0.15s, background 0.15s;
    border-left: 3px solid transparent;
    white-space: nowrap;
    overflow: hidden;
    border-radius: 0 8px 8px 0;
    margin: 1px 8px 1px 0;
}
.sidebar-nav a:hover {
    color: #f1f5f9;
    background: #1e293b;
}
.sidebar-nav a.active {
    color: #fff;
    background: #1e3a5f;
    border-left-color: #3b82f6;
}
.nav-icon {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
}
.nav-text {
    transition: opacity 0.15s, width 0.2s;
}

/* ── Footer / Logout ── */
.sidebar-footer {
    padding: 10px 0;
    border-top: 1px solid #1e293b;
    flex-shrink: 0;
}
.logout-link {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    gap: 12px;
    color: #64748b;
    text-decoration: none;
    transition: color 0.15s, background 0.15s;
    white-space: nowrap;
    overflow: hidden;
    border-radius: 0 8px 8px 0;
    margin: 1px 8px 1px 0;
}
.logout-link:hover { color: #f87171; background: #1e293b; }

/* ── Collapsed state ── */
body.sidebar-collapsed .sidebar { width: 58px; }
body.sidebar-collapsed .brand-text,
body.sidebar-collapsed .nav-text,
body.sidebar-collapsed .nav-section-label { opacity: 0; width: 0; overflow: hidden; }
body.sidebar-collapsed .sidebar-header { justify-content: center; padding: 18px 0; }
body.sidebar-collapsed .sidebar-brand { justify-content: center; }
body.sidebar-collapsed .sidebar-nav a,
body.sidebar-collapsed .logout-link { justify-content: center; padding: 12px 0; border-left-width: 0; margin: 1px 0; border-radius: 0; }
body.sidebar-collapsed .sidebar-nav a.active { border-left: 0; box-shadow: inset 3px 0 0 #3b82f6; }
body.sidebar-collapsed .main { margin-left: 58px; }
body.sidebar-collapsed .device-manager-section { display: none; }

/* ── Device Manager ── */
.device-manager-section {
    padding: 4px 16px 8px;
}
.device-manager-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
}
.device-manager-title {
    font-weight: 600;
    font-size: 13px;
    color: #94a3b8;
}
.device-count-badge {
    background: #1e293b;
    color: #3b82f6;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    min-width: 24px;
    text-align: center;
}
.device-manager-actions {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
}
.btn-device-action {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 5px 8px;
    border: 1px solid #334155;
    border-radius: 8px;
    background: transparent;
    color: #94a3b8;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
}
.btn-device-action:hover {
    background: #1e293b;
    color: #f1f5f9;
}
.btn-add-all:hover {
    border-color: #22c55e;
    color: #22c55e;
}
.btn-remove-all:hover {
    border-color: #ef4444;
    color: #ef4444;
}
.device-list-container {
    max-height: 280px;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: #334155 transparent;
}
.device-list-container::-webkit-scrollbar {
    width: 4px;
}
.device-list-container::-webkit-scrollbar-thumb {
    background: #334155;
    border-radius: 4px;
}
.device-list-loading {
    color: #475569;
    font-size: 12px;
    padding: 8px 0;
}
.device-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    transition: background 0.15s;
    cursor: default;
}
.device-item:hover {
    background: #1e293b;
}
.device-status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
}
.device-status-dot.up { background: #22c55e; }
.device-status-dot.down { background: #ef4444; }
.device-info {
    flex: 1;
    min-width: 0;
    overflow: hidden;
}
.device-name {
    font-size: 12px;
    color: #e2e8f0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
    line-height: 1.3;
}
.device-ip {
    font-size: 10px;
    color: #64748b;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
    line-height: 1.3;
}
.device-remove-btn {
    background: none;
    border: none;
    color: #475569;
    cursor: pointer;
    padding: 2px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, background 0.15s;
    flex-shrink: 0;
    opacity: 0;
}
.device-item:hover .device-remove-btn {
    opacity: 1;
}
.device-remove-btn:hover {
    color: #ef4444;
    background: rgba(239, 68, 68, 0.1);
}
.device-list-empty {
    color: #475569;
    font-size: 12px;
    font-style: italic;
    padding: 8px 0;
}
</style>

<script>
(function () {
    var collapsed = localStorage.getItem('sidebarCollapsed') === 'true';
    if (collapsed) {
        document.body.classList.add('sidebar-collapsed');
    }
    var btn = document.getElementById('sidebarToggle');
    if (btn) btn.innerHTML = collapsed ? '&#187;' : '&#171;';

    window.toggleSidebar = function () {
        collapsed = !collapsed;
        document.body.classList.toggle('sidebar-collapsed', collapsed);
        localStorage.setItem('sidebarCollapsed', collapsed);
        var b = document.getElementById('sidebarToggle');
        if (b) b.innerHTML = collapsed ? '&#187;' : '&#171;';
    };

    window.openMobileSidebar = function () {
        document.getElementById('sidebar').classList.add('mobile-open');
    };
    window.closeMobileSidebar = function () {
        document.getElementById('sidebar').classList.remove('mobile-open');
    };

    (function () {
        var mq = window.matchMedia('(max-width: 992px)');
        function onBreakpointChange(e) {
            if (!e.matches) {
                document.getElementById('sidebar').classList.remove('mobile-open');
            }
        }
        mq.addEventListener('change', onBreakpointChange);
        onBreakpointChange(mq);
    })();

    // ── Device Manager ──
    var deviceList = document.getElementById('deviceListContainer');
    var countBadge = document.getElementById('deviceCountBadge');
    var btnAddAll = document.getElementById('btnAddAll');
    var btnRemoveAll = document.getElementById('btnRemoveAll');

    function renderDevices(devices) {
        if (!devices || devices.length === 0) {
            deviceList.innerHTML = '<div class="device-list-empty">No devices found</div>';
            countBadge.textContent = '0';
            return;
        }
        countBadge.textContent = devices.length;
        var html = '';
        devices.forEach(function (d) {
            var statusClass = d.status ? 'up' : 'down';
            var displayName = d.device_name || d.ip;
            var removeBtn = window.IS_ADMIN
                ? '<button class="device-remove-btn" title="Remove device" onclick="window._removeDevice(\'' + d.ip + '\')">'
                + '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
                + '</button>'
                : '';
            html += '<div class="device-item" data-ip="' + d.ip + '">'
                + '<span class="device-status-dot ' + statusClass + '"></span>'
                + '<div class="device-info">'
                + '<span class="device-name" title="' + displayName + '">' + displayName + '</span>'
                + '<span class="device-ip" title="' + d.ip + '">' + d.ip + '</span>'
                + '</div>'
                + removeBtn
                + '</div>';
        });
        deviceList.innerHTML = html;
    }

    function loadDevices() {
        deviceList.innerHTML = '<div class="device-list-loading">Loading devices...</div>';
        fetch('/api/devices-sidebar')
            .then(function (r) { return r.json(); })
            .then(function (data) { renderDevices(data); })
            .catch(function () {
                deviceList.innerHTML = '<div class="device-list-empty">Failed to load</div>';
            });
    }

    window._removeDevice = function (ip) {
        if (!confirm('Remove device ' + ip + '?')) return;
        fetch('/api/devices/' + encodeURIComponent(ip), { method: 'DELETE', headers: { 'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]')?.content || '' } })
            .then(function (r) { return r.json(); })
            .then(function () { loadDevices(); })
            .catch(function () { alert('Failed to remove device'); });
    };

    if (btnAddAll) {
        btnAddAll.addEventListener('click', function () {
            if (!confirm('Add all devices to monitoring?')) return;
            btnAddAll.disabled = true;
            btnAddAll.textContent = 'Adding...';
            fetch('/api/ping/now')
                .then(function (r) { return r.json(); })
                .then(function () {
                    btnAddAll.disabled = false;
                    btnAddAll.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span class="nav-text">Add All</span>';
                    loadDevices();
                })
                .catch(function () {
                    btnAddAll.disabled = false;
                    btnAddAll.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span class="nav-text">Add All</span>';
                });
        });
    }

    if (btnRemoveAll) {
        btnRemoveAll.addEventListener('click', function () {
            if (!confirm('Remove ALL devices? This cannot be undone.')) return;
            btnRemoveAll.disabled = true;
            btnRemoveAll.textContent = 'Removing...';
            fetch('/api/devices/bulk-remove-all', { method: 'POST', headers: { 'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]')?.content || '' } })
                .then(function (r) { return r.json(); })
                .then(function () {
                    btnRemoveAll.disabled = false;
                    btnRemoveAll.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg><span class="nav-text">Remove All</span>';
                    loadDevices();
                })
                .catch(function () {
                    btnRemoveAll.disabled = false;
                    btnRemoveAll.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg><span class="nav-text">Remove All</span>';
                });
        });
    }

    loadDevices();
    setInterval(loadDevices, 30000);
})();
</script>

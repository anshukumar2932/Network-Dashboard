<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devices - Network Monitor</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background: #f5f8fc; font-family: 'Segoe UI', sans-serif; }
.sidebar { width:240px; min-height:100vh; background:#0f172a; color:#fff; position:fixed; padding:24px 0; }
.sidebar h5 { padding:0 20px; margin-bottom:24px; font-weight:700; }
.sidebar a { display:block; padding:10px 20px; color:#94a3b8; text-decoration:none; transition:.2s; }
.sidebar a:hover, .sidebar a.active { color:#fff; background:#1e293b; }
.main { margin-left:240px; padding:32px; }
.card { background:#fff; border-radius:16px; border:1px solid #e2e8f0; padding:24px; margin-bottom:24px; }
.form-control, .form-select { height:48px; border-radius:12px; }
</style>
</head>
<body>
<div class="sidebar">
    <h5>Network Monitor</h5>
    <a href="/dashboard">Dashboard</a>
    <a href="/locations">Locations</a>
    <a href="/sites">Sites</a>
    <a href="/devices" class="active">Devices</a>
    <a href="/devices/upload">Upload Excel</a>
    <a href="/details/view">Details</a>
    <a href="/logout">Logout</a>
</div>
<div class="main">
    <h2 class="mb-4">Devices</h2>
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    {% for msg in messages %}
    <div class="alert alert-info">{{ msg }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}
    <div class="card">
        <h5 class="mb-3">{{ "Edit Device" if edit else "Add Device" }}</h5>
        <form method="POST">
            {% if edit %}
            <input type="hidden" name="id" value="{{ edit.id }}">
            {% endif %}
            <div class="row g-3">
                <div class="col-md-3">
                    <input type="text" name="hostname" class="form-control" placeholder="Hostname" value="{{ edit.hostname if edit else '' }}" required>
                </div>
                <div class="col-md-2">
                    <input type="text" name="ip" class="form-control" placeholder="IP" value="{{ edit.ip if edit else '' }}" required>
                </div>
                <div class="col-md-2">
                    <input type="text" name="model" class="form-control" placeholder="Model" value="{{ edit.model if edit else '' }}" required>
                </div>
                <div class="col-md-2">
                    <select name="category" class="form-select" required>
                        <option value="">Category...</option>
                        <option value="radio" {{ 'selected' if edit and edit.category=='radio' }}>Radio</option>
                        <option value="ap" {{ 'selected' if edit and edit.category=='ap' }}>AP</option>
                        <option value="switch" {{ 'selected' if edit and edit.category=='switch' }}>Switch</option>
                        <option value="router" {{ 'selected' if edit and edit.category=='router' }}>Router</option>
                        <option value="server" {{ 'selected' if edit and edit.category=='server' }}>Server</option>
                        <option value="other" {{ 'selected' if edit and edit.category=='other' }}>Other</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select name="site_id" class="form-select" required>
                        <option value="">Site...</option>
                        {% for site in sites %}
                        <option value="{{ site.id }}" {{ 'selected' if edit and edit.site_id==site.id }}>{{ site.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <select name="device_if" class="f active"
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary" style="height:48px;border-radius:12px;">{{ "Update" if edit else "Add" }}</button>
                    {% if edit %}<a href="/devices" class="btn btn-outline-secondary ms-2" style="height:48px;border-radius:12px;">Cancel</a>{% endif %}
                </div>
            </div>
        </form>
    </div>
    <div class="card">
        <table class="table table-hover mb-0">
            <thead><tr><th>#</th><th>Hostname</th><th>IP</th><th>Model</th><th>Category</th><th>Site</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
                {% for d in devices %}
                <tr>
                    <td>{{ d.id }}</td>
                    <td>{{ d.hostname }}</td>
                    <td>{{ d.ip }}</td>
                    <td>{{ d.model }}</td>
                    <td>{{ d.category }}</td>
                    <td>{{ d.site.name if d.site else '' }}</td>
                    <td><span class="badge bg-{{ 'success' if d.status else 'danger' }}">{{ "Up" if d.status else "Down" }}</span></td>
                    <td>
                        <a href="/devices?edit={{ d.id }}" class="btn btn-sm btn-outline-primary">Edit</a>
                        <a href="/devices/delete/{{ d.id }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this device?')">Delete</a>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="8" class="text-muted">No devices yet.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Details - Network Monitor</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background: #f5f8fc; font-family: 'Segoe UI', sans-serif; padding: 32px; }
.card { border-radius: 16px; border: 1px solid #e2e8f0; }
</style>
</head>
<body>

<div class="container">
    <a href="/dashboard" class="btn btn-outline-secondary mb-3">&larr; Back to Dashboard</a>
    <h2 class="mb-4">{{ show | title }} Details</h2>

    {% if detail %}
    <div class="row g-3">
        {% for item in detail %}
        <div class="col-md-4">
            <div class="card p-3">
                <h5>{{ item.name }}</h5>
                <p class="text-muted mb-0">
                    {% if item.location %}
                    Location: {{ item.location.name if item.location else 'N/A' }}
                    {% endif %}
                </p>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="alert alert-info">No details found.</div>
    {% endif %}
</div>

</body>
</html>

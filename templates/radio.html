<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Network Monitor</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background: #f5f8fc; font-family: 'Segoe UI', sans-serif; }
.sidebar { width:240px; min-height:100vh; background:#0f172a; color:#fff; position:fixed; padding:24px 0; }
.sidebar h5 { padding:0 20px; margin-bottom:24px; font-weight:700; }
.sidebar a { display:block; padding:10px 20px; color:#94a3b8; text-decoration:none; transition:.2s; }
.sidebar a:hover, .sidebar a.active { color:#fff; background:#1e293b; }
.main { margin-left:240px; padding:32px; }
.kpi-card { background:#fff; border-radius:16px; padding:20px; border:1px solid #e2e8f0; text-align:center; }
.kpi-card .number { font-size:32px; font-weight:700; color:#0f172a; }
.kpi-card .label { color:#64748b; font-size:14px; }
.chart-card { background:#fff; border-radius:16px; padding:20px; border:1px solid #e2e8f0; }
#cy { width:100%; height:500px; border:1px solid #e2e8f0; border-radius:12px; background:#fff; }
#cy-loading { display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:500px; border:1px solid #e2e8f0; border-radius:12px; background:#fff; color:#94a3b8; font-size:16px; }
.panel-card { background:#fff; border-radius:16px; border:1px solid #e2e8f0; padding:20px; height:450px; display:flex; flex-direction:column; }
.panel-card .panel-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.panel-card .panel-head h5 { margin:0; }
.panel-card .panel-body { flex:1; position:relative; overflow-y:auto; }
.alert-item { padding:8px 12px; border-radius:8px; margin-bottom:6px; font-size:14px; }
.alert-down { background:#fef2f2; border-left:3px solid #dc3545; }
.cat-row { display:flex; align-items:center; padding:8px 0; border-bottom:1px solid #f1f5f9; font-size:14px; }
.cat-row:last-child { border-bottom:none; }
.cat-row .cat-dot { width:12px; height:12px; border-radius:50%; margin-right:10px; }
.cat-row .cat-name { flex:1; font-weight:500; text-transform:capitalize; }
.cat-row .cat-count { font-weight:600; color:#0f172a; margin:0 12px; }
.site-info { font-size:13px; }
.site-info h6 { font-weight:600; margin-bottom:6px; }
.site-info .row-item { display:flex; justify-content:space-between; padding:2px 0; }
</style>
</head>
<body>

<div class="sidebar">
    <h5>Network Monitor</h5>
    <a href="/dashboard" class="active">Dashboard</a>
    <a href="/dashboard/radio">Radio View</a>
    <a href="/locations">Locations</a>
    <a href="/sites">Sites</a>
    <a href="/devices">Devices</a>
    <a href="/devices/upload">Upload Excel</a>
    <a href="/details/view">Details</a>
    <a href="/logout">Logout</a>
</div>

<div class="main">
    <h2 class="mb-4">Dashboard</h2>

    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="kpi-card">
                <div class="number" id="kpiTotal">0</div>
                <div class="label">Total Devices</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="kpi-card">
                <div class="number text-success" id="kpiUp">0</div>
                <div class="label">Devices Up</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="kpi-card">
                <div class="number text-danger" id="kpiDown">0</div>
                <div class="label">Devices Down</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="kpi-card">
                <div class="number text-warning" id="kpiAlerts">0</div>
                <div class="label">Active Alerts</div>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-12">
            <div class="chart-card">
                <h5 class="mb-3" style="display:flex;align-items:center;gap:8px;">
                    <span id="topoTitle">Network Topology</span>
                    <button id="collapseAllBtn" class="btn btn-sm btn-outline-secondary" style="display:none" onclick="collapseAll()">Collapse All</button>
                </h5>
                <div id="cy-loading">
                    Fetching topology...
                </div>
                <div id="cy" style="display:none"></div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-md-5">
            <div class="panel-card">
                <div class="panel-head">
                    <h5>Alerts</h5>
                    <span class="badge bg-danger" id="alertCount">0</span>
                </div>
                <div class="panel-body" id="alertList">
                    <div class="text-muted text-center py-4">No alerts</div>
                </div>
            </div>
        </div>
        <div class="col-md-7">
            <div class="panel-card">
                <div class="panel-head">
                    <h5>Device Status</h5>
                </div>
                <div class="panel-body">
                    <canvas id="pieChart" style="max-height:200px;margin-bottom:12px"></canvas>
                    <div id="categoryList"></div>
                    <hr>
                    <div id="siteInfoPanel" class="site-info text-muted text-center py-3">Tap a site or device for details</div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="linkModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title" id="linkModalLabel">Link</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="linkModalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
<script>
(function(){
    let pieChart = null;
    let cy = null;
    let cyReady = false;
    const style = [
        { selector: 'node', style: { 'label': 'data(label)', 'text-valign': 'bottom', 'font-size': '11px', 'width': '25px', 'height': '25px', 'background-color': '#94a3b8' } },
        { selector: 'node[type = "location"]', style: { 'width': 50, 'height': 50, 'font-size': '14px', 'font-weight': 'bold' } },
        { selector: 'node[type = "site"]', style: { 'width': 22, 'height': 22, 'font-size': '10px' } },
        { selector: 'node[type = "device"]', style: { 'width': 12, 'height': 12, 'font-size': '8px' } },
        { selector: 'edge[status = true]', style: { 'line-color': '#198754', 'width': 3, 'font-size': '10px', 'text-margin-y': -8 } },
        { selector: 'edge[status = false]', style: { 'line-color': '#dc3545', 'width': 3, 'font-size': '10px', 'text-margin-y': -8 } },
        { selector: 'edge', style: { 'label': 'data(label)', 'text-valign': 'top', 'text-background-color': '#ffffff', 'text-background-opacity': 1, 'text-background-padding': 2 } }
    ];
    const expandedLocations = new Map();
    const expandedSites = new Map();
    const locationCache = {};
    const siteCache = {};

    function nodeColor(d) {
        if (d.status === 'GREEN') return '#198754';
        if (d.status === 'YELLOW') return '#ffc107';
        if (d.status === 'RED') return '#dc3545';
        if (d.status === true || d.status === 'true') return '#198754';
        if (d.status === false || d.status === 'false') return '#dc3545';
        return '#94a3b8';
    }

    function initGraph(data) {
        if (!cy) {
            cy = cytoscape({
                container: document.getElementById('cy'),
                style: style,
                layout: { name: 'preset', fit: true, padding: 50 }
            });
        }
        const container = document.getElementById('cy');
        const loading = document.getElementById('cy-loading');
        loading.style.display = 'none';
        container.style.display = 'block';

        setElements(data.nodes || [], data.edges || []);
        cy.fit(undefined, 50);
        setupEvents();
        cyReady = true;
    }

    function setElements(nodes, edges) {
        const existing = new Set();
        cy.nodes().forEach(function(n) { existing.add(n.id()); });
        cy.edges().forEach(function(e) { existing.add(e.id()); });

        const toAdd = [];
        (nodes || []).forEach(function(n) {
            if (!existing.has(n.data.id)) {
                toAdd.push({ group: 'nodes', data: n.data, position: n.position });
            }
        });
        (edges || []).forEach(function(e) {
            if (!existing.has(e.data.id)) {
                toAdd.push({ group: 'edges', data: e.data });
            }
        });
        if (toAdd.length) cy.add(toAdd);

        // Remove stale elements (only non-location non-site non-device)
        const validIds = new Set();
        (nodes || []).forEach(function(n) { validIds.add(n.data.id); });
        (edges || []).forEach(function(e) { validIds.add(e.data.id); });
        cy.nodes().forEach(function(n) {
            if (!validIds.has(n.id())) n.remove();
        });
        cy.edges().forEach(function(e) {
            if (!validIds.has(e.id())) e.remove();
        });

        colorAllNodes();
    }

    function colorAllNodes() {
        cy.nodes().forEach(function(n) {
            n.style('background-color', nodeColor(n.data()));
        });
    }

    function updateNodeColors(changes) {
        (changes || []).forEach(function(c) {
            const id = 'device-' + c.id;
            const el = cy.getElementById(id);
            if (el.length) {
                el.data('status', c.status);
                el.style('background-color', nodeColor(c));
                el.data('status_bool', c.status);
            }
        });
    }

    function setupEvents() {
        let tapTimer = null;
        let tappedNode = null;

        cy.removeListener('tap');
        cy.on('tap', 'node', function(evt) {
            const node = evt.target;
            const type = node.data('type');

            if (tapTimer && tappedNode === node) {
                clearTimeout(tapTimer);
                tapTimer = null;
                tappedNode = null;
                if (type === 'location') {
                    window.location.href = '/location/' + node.data('location_id');
                } else if (type === 'site') {
                    window.location.href = '/site/' + node.data('id').replace('site-', '');
                } else if (type === 'device') {
                    // no page for individual devices
                }
                return;
            }

            tappedNode = node;
            tapTimer = setTimeout(function() {
                tapTimer = null;
                tappedNode = null;
                if (type === 'location') {
                    toggleExpandLocation(node);
                } else if (type === 'site') {
                    toggleExpandSite(node);
                } else if (type === 'device') {
                    showDeviceInfo(node);
                }
            }, 300);
        });

        cy.on('tap', 'edge', function(evt) {
            const d = evt.target.data();
            document.getElementById('linkModalLabel').textContent =
                (d.source_site_name || d.source) + ' \u2194 ' + (d.destination_site_name || d.target);
            const body = document.getElementById('linkModalBody');
            body.innerHTML = [
                '<table class="table table-sm mb-0">',
                '<tr><th colspan="2" class="text-center ' + (d.status ? 'text-success' : 'text-danger') + '">' + (d.status ? 'UP' : 'DOWN') + '</th></tr>',
                '<tr><th colspan="2" class="bg-light">' + (d.source_site_name || d.source) + '</th></tr>',
                '<tr><td>Device</td><td>' + (d.device_a || '-') + '</td></tr>',
                '<tr><td>IP</td><td>' + (d.device_a_ip || '-') + '</td></tr>',
                '<tr><td>Model</td><td>' + (d.device_a_model || '-') + '</td></tr>',
                '<tr><th colspan="2" class="bg-light">' + (d.destination_site_name || d.target) + '</th></tr>',
                '<tr><td>Device</td><td>' + (d.device_b || '-') + '</td></tr>',
                '<tr><td>IP</td><td>' + (d.device_b_ip || '-') + '</td></tr>',
                '<tr><td>Model</td><td>' + (d.device_b_model || '-') + '</td></tr>',
                '<tr><th>Last Checked</th><td>' + (d.last_checked || '-') + '</td></tr>',
                '</table>'
            ].join('');
            new bootstrap.Modal(document.getElementById('linkModal')).show();
        });
    }

    // === Location expand/collapse ===
    async function toggleExpandLocation(locNode) {
        const locId = locNode.data('location_id');
        if (expandedLocations.has(locId)) {
            collapseLocation(locId);
        } else {
            await expandLocation(locNode, locId);
        }
    }

    async function expandLocation(locNode, locId) {
        try {
            let data;
            if (locationCache[locId]) {
                data = locationCache[locId];
            } else {
                const r = await fetch('/api/topology/location/' + locId + '/sites');
                data = await r.json();
                locationCache[locId] = data;
            }

            const siteIds = new Set();
            const edgeIds = new Set();
            const bx = locNode.position('x');
            const by = locNode.position('y');
            const count = (data.nodes || []).length;
            const cols = Math.min(count, 5);

            (data.nodes || []).forEach(function(n, i) {
                if (cy.getElementById(n.data.id).length) return;
                const col = i % cols;
                const row = Math.floor(i / cols);
                const pos = {
                    x: bx - (cols - 1) * 10 + col * 20,
                    y: by + 40 + row * 20
                };
                cy.add({ group: 'nodes', data: n.data, position: pos });
                const el = cy.getElementById(n.data.id);
                el.style('background-color', nodeColor(n.data));
                el.animate({ position: { x: pos.x, y: pos.y } }, { duration: 400, easing: 'ease-out' });
                siteIds.add(n.data.id);
            });

            // Add edges where both endpoints are visible
            (data.edges || []).forEach(function(e) {
                if (cy.getElementById(e.data.id).length) return;
                const srcVis = !!cy.getElementById(e.data.source).length;
                const tgtVis = !!cy.getElementById(e.data.target).length;
                if (srcVis && tgtVis) {
                    cy.add({ group: 'edges', data: e.data });
                    edgeIds.add(e.data.id);
                }
            });

            // Aggregate edges: for edges whose target is NOT visible but is in another location,
            // draw an edge to that location node instead
            var locEdgeIds = new Set();
            (data.edges || []).forEach(function(e) {
                if (cy.getElementById(e.data.id).length) return;
                var srcVis = !!cy.getElementById(e.data.source).length;
                var tgtVis = !!cy.getElementById(e.data.target).length;
                if (srcVis && !tgtVis) {
                    var tgtLocId = e.data.destination_location_id || e.data.source_location_id;
                    var aggId = 'agg-' + e.data.id;
                    if (!cy.getElementById(aggId).length) {
                        cy.add({
                            group: 'edges',
                            data: {
                                id: aggId,
                                source: e.data.source,
                                target: 'loc-' + tgtLocId,
                                label: '',
                                status: e.data.status,
                                source_site_name: e.data.source_site_name || '',
                                destination_site_name: '',
                                device_a: e.data.device_a || '',
                                device_a_ip: e.data.device_a_ip || '',
                                device_a_model: e.data.device_a_model || '',
                                device_b: e.data.device_b || '',
                                device_b_ip: e.data.device_b_ip || '',
                                device_b_model: e.data.device_b_model || '',
                                last_checked: e.data.last_checked || ''
                            }
                        });
                    }
                    locEdgeIds.add(aggId);
                }
            });

            expandedLocations.set(locId, { siteIds: siteIds, edgeIds: edgeIds, locEdgeIds: locEdgeIds });
            updateCollapseBtn();
            cy.fit(undefined, 50);
        } catch(e) {
            console.error('Expand location failed:', e);
        }
    }

    function collapseLocation(locId) {
        var entry = expandedLocations.get(locId);
        if (!entry) return;
        entry.siteIds.forEach(function(id) { var el = cy.getElementById(id); if (el.length) el.remove(); });
        entry.edgeIds.forEach(function(id) { var el = cy.getElementById(id); if (el.length) el.remove(); });
        (entry.locEdgeIds || []).forEach(function(id) { var el = cy.getElementById(id); if (el.length) el.remove(); });
        expandedLocations.delete(locId);
        updateCollapseBtn();
        cy.fit(undefined, 50);
    }

    // === Site expand/collapse ===
    async function toggleExpandSite(siteNode) {
        var siteId = siteNode.data('id').replace('site-', '');
        if (expandedSites.has(siteId)) {
            collapseSite(siteId);
        } else {
            await expandSite(siteNode, siteId);
        }
    }

    async function expandSite(siteNode, siteId) {
        try {
            var data;
            if (siteCache[siteId]) {
                data = siteCache[siteId];
            } else {
                var r = await fetch('/api/topology/site/' + siteId + '/devices');
                data = await r.json();
                siteCache[siteId] = data;
            }
            var deviceIds = new Set();
            var edgeIds = new Set();
            var siteNodeId = 'site-' + siteId;
            var bx = siteNode.position('x');
            var by = siteNode.position('y');
            var count = (data.nodes || []).length;
            var cols = Math.min(count, 6);

            (data.nodes || []).forEach(function(n, i) {
                if (cy.getElementById(n.data.id).length) return;
                var col = i % cols;
                var row = Math.floor(i / cols);
                var pos = {
                    x: bx - (cols - 1) * 10 + col * 20,
                    y: by + 30 + row * 20
                };
                cy.add({ group: 'nodes', data: n.data, position: pos });
                var el = cy.getElementById(n.data.id);
                el.style('background-color', nodeColor(n.data));
                el.animate({ position: { x: pos.x, y: pos.y } }, { duration: 400, easing: 'ease-out' });
                deviceIds.add(n.data.id);

                // Edge from site to device
                var eid = 'site-device-edge-' + siteId + '-' + n.data.id;
                if (!cy.getElementById(eid).length) {
                    cy.add({
                        group: 'edges',
                        data: {
                            id: eid,
                            source: siteNodeId,
                            target: n.data.id,
                            label: '',
                            status: n.data.status
                        }
                    });
                    edgeIds.add(eid);
                }
            });

            expandedSites.set(siteId, { deviceIds: deviceIds, edgeIds: edgeIds });
            updateCollapseBtn();
            cy.fit(undefined, 50);
        } catch(e) {
            console.error('Expand site failed:', e);
        }
    }

    function collapseSite(siteId) {
        var entry = expandedSites.get(siteId);
        if (!entry) return;
        entry.deviceIds.forEach(function(id) { var el = cy.getElementById(id); if (el.length) el.remove(); });
        (entry.edgeIds || []).forEach(function(id) { var el = cy.getElementById(id); if (el.length) el.remove(); });
        expandedSites.delete(siteId);
        updateCollapseBtn();
        cy.fit(undefined, 50);
    }

    function updateCollapseBtn() {
        var btn = document.getElementById('collapseAllBtn');
        btn.style.display = (expandedLocations.size > 0 || expandedSites.size > 0) ? 'inline-block' : 'none';
    }

    window.collapseAll = function() {
        Array.from(expandedSites.keys()).forEach(function(k) { collapseSite(k); });
        Array.from(expandedLocations.keys()).forEach(function(k) { collapseLocation(k); });
        if (cy) cy.fit(undefined, 50);
    };

    function showDeviceInfo(node) {
        var d = node.data();
        var panel = document.getElementById('siteInfoPanel');
        if (panel) {
            var statusText = (d.status === true || d.status === 'true' || d.status === 'GREEN') ? 'UP' : 'DOWN';
            var statusClass = (d.status === true || d.status === 'true' || d.status === 'GREEN') ? 'bg-success' : 'bg-danger';
            panel.innerHTML = [
                '<h6>' + d.label + '</h6>',
                '<div class="row-item"><span>IP</span><span>' + (d.ip || '-') + '</span></div>',
                '<div class="row-item"><span>Model</span><span>' + (d.model || '-') + '</span></div>',
                '<div class="row-item"><span>Category</span><span>' + (d.category || '-') + '</span></div>',
                '<div class="row-item"><span>Status</span><span class="badge ' + statusClass + '">' + statusText + '</span></div>'
            ].join('');
        }
    }

    function showSiteInfo(node) {
        var d = node.data();
        var panel = document.getElementById('siteInfoPanel');
        if (panel) {
            var statusBadge = d.status === 'GREEN' ? 'bg-success' : (d.status === 'RED' ? 'bg-danger' : 'bg-warning text-dark');
            panel.innerHTML = [
                '<h6>' + d.label + '</h6>',
                '<div class="row-item"><span>Devices</span><span>' + d.device_count + '</span></div>',
                '<div class="row-item"><span>Down</span><span class="' + (d.down_count > 0 ? 'text-danger' : '') + '">' + d.down_count + '</span></div>',
                '<div class="row-item"><span>Status</span><span class="badge ' + statusBadge + '">' + d.status + '</span></div>'
            ].join('');
        }
    }

    // === Auto Play / Guided Tour ===
    function sleep(ms) {
        return new Promise(function(resolve) { setTimeout(resolve, ms); });
    }

    async function autoPlay() {
        collapseAll();
        await sleep(500);

        var loc1 = cy.getElementById('loc-1');
        if (loc1.length) {
            cy.animate({ center: { eles: loc1 }, zoom: 1.5 }, { duration: 500 });
            await sleep(600);
            await expandLocation(loc1, 1);
            await sleep(800);
            cy.animate({ fit: { eles: cy.getElementById('loc-1').connectedEdges().union(cy.getElementById('loc-1')), padding: 80 } }, { duration: 500 });
            await sleep(600);
        }

        var loc2 = cy.getElementById('loc-2');
        if (loc2.length) {
            cy.animate({ center: { eles: loc2 }, zoom: 1.5 }, { duration: 500 });
            await sleep(600);
            await expandLocation(loc2, 2);
            await sleep(800);
            cy.animate({ fit: { eles: cy.elements(), padding: 80 } }, { duration: 500 });
            await sleep(600);
        }

        var loc1Sites = expandedLocations.get(1);
        if (loc1Sites) {
            var siteIds = Array.from(loc1Sites.siteIds);
            for (var i = 0; i < siteIds.length; i++) {
                var siteEl = cy.getElementById(siteIds[i]);
                if (siteEl.length && !expandedSites.has(siteIds[i].replace('site-', ''))) {
                    cy.animate({ center: { eles: siteEl }, zoom: 2 }, { duration: 400 });
                    await sleep(500);
                    await expandSite(siteEl, siteIds[i].replace('site-', ''));
                    await sleep(400);
                }
            }
        }

        var loc2Sites = expandedLocations.get(2);
        if (loc2Sites) {
            var siteIds2 = Array.from(loc2Sites.siteIds);
            for (var i = 0; i < siteIds2.length; i++) {
                var siteEl = cy.getElementById(siteIds2[i]);
                if (siteEl.length && !expandedSites.has(siteIds2[i].replace('site-', ''))) {
                    cy.animate({ center: { eles: siteEl }, zoom: 2 }, { duration: 400 });
                    await sleep(500);
                    await expandSite(siteEl, siteIds2[i].replace('site-', ''));
                    await sleep(400);
                }
            }
        }

        cy.animate({ fit: { eles: cy.elements(), padding: 60 } }, { duration: 600 });
    }

    // === Auto-scroll alerts panel ===
    var alertScrollInterval = null;

    function startAlertScroll() {
        stopAlertScroll();
        alertScrollInterval = setInterval(function() {
            var container = document.getElementById('alertList');
            if (!container) return;
            var scrollable = container.parentElement;
            if (!scrollable) return;
            var maxScroll = scrollable.scrollHeight - scrollable.clientHeight;
            if (maxScroll <= 0) return;
            var next = scrollable.scrollTop + 30;
            if (next >= maxScroll) {
                next = 0;
            }
            scrollable.scrollTop = next;
        }, 200);
    }

    function stopAlertScroll() {
        if (alertScrollInterval) {
            clearInterval(alertScrollInterval);
            alertScrollInterval = null;
        }
    }

    async function loadGraph() {
        try {
            var r = await fetch("/api/topology/locations");
            var data = await r.json();
            initGraph(data);
        } catch(e) {
            document.getElementById('cy-loading').innerHTML = 'Unavailable: ' + e.message;
        }
    }

    function updatePieAndCategories(data) {
        if (pieChart) pieChart.destroy();
        var ctx = document.getElementById("pieChart").getContext("2d");
        pieChart = new Chart(ctx, {
            type: "doughnut",
            data: {
                labels: ["Up", "Down"],
                datasets: [{
                    data: [data.up, data.down],
                    backgroundColor: ["#198754", "#dc3545"],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: { legend: { position: "bottom", labels: { boxWidth: 12, padding: 12 } } }
            }
        });

        var colors = ["#3b82f6","#8b5cf6","#f59e0b","#06b6d4","#ef4444","#84cc16"];
        var container = document.getElementById("categoryList");
        container.innerHTML = (data.categories || []).map(function(c, i) {
            if (!c.total) return "";
            return '<div class="cat-row">' +
                '<span class="cat-dot" style="background:' + colors[i % colors.length] + '"></span>' +
                '<span class="cat-name">' + c.category + '</span>' +
                '<span class="cat-count">' + c.total + '</span>' +
                '<span class="badge bg-success me-1">' + c.up + ' up</span>' +
                '<span class="badge bg-danger">' + c.down + ' down</span>' +
                '</div>';
        }).join("");
    }

    async function loadAlerts() {
        try {
            var r = await fetch("/api/alerts");
            var alerts = await r.json();
            var container = document.getElementById("alertList");
            document.getElementById("alertCount").textContent = alerts.length;
            if (!alerts.length) {
                container.innerHTML = '<div class="text-muted text-center py-4">All devices operational</div>';
                stopAlertScroll();
                return;
            }
            container.innerHTML = alerts.map(function(a) {
                return '<div class="alert-item alert-down">' +
                    '<strong>' + a.label + '</strong>' +
                    '<span class="text-muted ms-2">' + a.ip + '</span>' +
                    '<span class="text-muted ms-2">' + a.site + '</span>' +
                    '</div>';
            }).join("");
            startAlertScroll();
        } catch(e) {
            document.getElementById("alertList").innerHTML = '<div class="text-muted text-center py-4">Unavailable</div>';
            stopAlertScroll();
        }
    }

    async function loadDevices() {
        try {
            var r = await fetch("/api/devices-stats");
            var data = await r.json();
            document.getElementById("kpiTotal").textContent = data.total;
            document.getElementById("kpiUp").textContent = data.up;
            document.getElementById("kpiDown").textContent = data.down;
            updatePieAndCategories(data);
        } catch(e) {}
    }

    loadAlerts().then(loadDevices).then(loadGraph).then(function() { setTimeout(autoPlay, 500); });

    // Poll every 30s — topology is loaded once, only alerts/devices refresh
    setInterval(function() {
        loadAlerts();
        loadDevices();
    }, 30000);
})();
</script>
</body>
</html>
